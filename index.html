
<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Noor's Herbal Shop</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f5ed;
      color: #24452f;
      text-align: center;
    }
    header {
      background: #24452f;
      color: white;
      padding: 25px 15px;
    }
    header h1 {
      margin: 0;
      font-size: 32px;
    }
    .hero {
      padding: 50px 20px;
    }
    .hero h2 {
      font-size: 27px;
    }
    .hero p {
      color: #555;
      line-height: 1.8;
    }
    .products {
      background: white;
      margin: 20px;
      padding: 25px;
      border-radius: 12px;
    }
    .button {
      display: inline-block;
      background: #24452f;
      color: white;
      padding: 12px 22px;
      border-radius: 6px;
      text-decoration: none;
    }
    footer {
      padding: 20px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Noor's</h1>
    <p>প্রকৃতির যত্ন, আপনার জন্য</p>
  </header>

  <section class="hero">
    <h2>প্রকৃতির বিশুদ্ধতা</h2>
    <p>আপনার দৈনন্দিন জীবনের জন্য বেছে নেওয়া প্রাকৃতিক পণ্য।</p>
    <a class="button" href="#products">পণ্য দেখুন</a>
  </section>

  <section class="products" id="products">
    <h2>আমাদের পণ্য</h2>
    <p>শিগগিরই আমাদের পণ্যের তালিকা এখানে দেখতে পাবেন।</p>
  </section>

  <footer>
    © Noor's — সর্বস্বত্ব সংরক্ষিত
  </footer>
</body>
</html>
